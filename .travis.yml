language: java

cache:
  directories:
    - $HOME/.m2

jdk:
  - openjdk8
  - openjdk11
  - openjdk-ea
  - oraclejdk11

matrix:
  exclude:
    - jdk: openjdk-ea
  include:
    - jdk: openjdk-ea
      env: JACOCO_SKIP=true
    # Travis can no longer provision openjdk14 (apt: "Unable to locate package bellsoft-java14"),
    # so this leg installs AdoptOpenJDK 14.0.2 itself on top of the openjdk11 image.
    - name: "openjdk14 (AdoptOpenJDK 14.0.2)"
      jdk: openjdk11
      before_install:
        - curl -sSfL -o /tmp/jdk14.tar.gz https://github.com/AdoptOpenJDK/openjdk14-binaries/releases/download/jdk-14.0.2%2B12/OpenJDK14U-jdk_x64_linux_hotspot_14.0.2_12.tar.gz
        - mkdir -p /tmp/jdk14 && tar -xzf /tmp/jdk14.tar.gz -C /tmp/jdk14 --strip-components=1
        - export JAVA_HOME=/tmp/jdk14 && export PATH=/tmp/jdk14/bin:$PATH
        - java -version

# --no-transfer-progress requires Maven 3.6.1+. Otherwise use --batch-mode
script:
  - mvn -V --no-transfer-progress -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true
  # List every skipped test with its reason (surefire prints only a count)
  - |
    python3 -c "import glob, xml.etree.ElementTree as E; [print('SKIPPED TEST: %s.%s -- reason: %s' % (t.get('classname'), t.get('name'), t.find('skipped').get('message'))) for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')) for t in E.parse(f).iter('testcase') if t.find('skipped') is not None]"
